<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Subtle Blueprint Linear Gradient -->
    <linearGradient id="bp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>

    <!-- Blueprint Grid Minor 24px -->
    <pattern id="bp-grid-minor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#6366F1" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <!-- Blueprint Grid Major 120px -->
    <pattern id="bp-grid-major" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#4F46E5" stroke-width="1.2" stroke-opacity="0.12" />
      <!-- Grid Cross Intersection Markers -->
      <path d="M 5 0 L -5 0 M 0 5 L 0 -5" fill="none" stroke="#4F46E5" stroke-width="1.2" stroke-opacity="0.25" />
    </pattern>

    <!-- Ambient Radial Glows -->
    <radialGradient id="bp-radial-1" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bp-radial-2" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Clean Tone -->
  <rect width="1920" height="1080" fill="url(#bp-bg)" />

  <!-- Radial Glow Accents -->
  <rect width="1920" height="1080" fill="url(#bp-radial-1)" />
  <rect width="1920" height="1080" fill="url(#bp-radial-2)" />

  <!-- Grid Overlays -->
  <rect width="1920" height="1080" fill="url(#bp-grid-minor)" />
  <rect width="1920" height="1080" fill="url(#bp-grid-major)" />

  <!-- Educational Vector Accents (Geometric Compass & Calculus Paths) -->
  <g stroke="#4F46E5" fill="none" opacity="0.14" stroke-width="1.5">
    <!-- Flow Wave 1 -->
    <path d="M -50 320 C 350 180, 800 550, 1350 280 C 1650 150, 1850 240, 2000 220" stroke-dasharray="6 4" />
    <!-- Wave 2 -->
    <path d="M -50 540 C 400 380, 750 720, 1400 480 C 1700 360, 1880 440, 2000 410" stroke="#0284C7" stroke-width="1.2" />
    <!-- Concentric Target Circles -->
    <circle cx="1600" cy="200" r="80" stroke-dasharray="4 4" />
    <circle cx="1600" cy="200" r="140" stroke-opacity="0.5" />
    <circle cx="280" cy="720" r="110" stroke-dasharray="4 4" />
  </g>
</svg>
