<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E1B4B" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <radialGradient id="mesh-1" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#312E81" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh-2" cx="85%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh-3" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <!-- Geometric Dot Matrix -->
    <pattern id="dot-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E2E8F0" fill-opacity="0.08" />
    </pattern>
    <!-- Hairline Graph Grid -->
    <pattern id="graph-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.025" />
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Ambient Light Fields -->
  <rect width="1920" height="1080" fill="url(#mesh-1)" />
  <rect width="1920" height="1080" fill="url(#mesh-2)" />
  <rect width="1920" height="1080" fill="url(#mesh-3)" />

  <!-- Grid Overlays -->
  <rect width="1920" height="1080" fill="url(#graph-grid)" />
  <rect width="1920" height="1080" fill="url(#dot-grid)" />

  <!-- Flowing Architectural Curves -->
  <g fill="none" stroke-linecap="round" opacity="0.4">
    <!-- Flow Wave 1 -->
    <path d="M -100 350 C 400 150, 900 650, 1400 350 C 1700 170, 1950 280, 2050 320" stroke="#818CF8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
    <!-- Flow Wave 2 -->
    <path d="M -100 480 C 450 280, 850 780, 1450 480 C 1750 330, 1950 450, 2050 470" stroke="#38BDF8" stroke-width="1.5" opacity="0.5" />
    <!-- Glow Arc -->
    <path d="M 200 900 C 650 650, 1200 950, 1750 750" stroke="#C084FC" stroke-width="2" opacity="0.3" />
  </g>

  <!-- Learning Constellation Nodes -->
  <g fill="#FFFFFF">
    <circle cx="450" cy="220" r="3" fill-opacity="0.5" />
    <circle cx="680" cy="380" r="2.5" fill-opacity="0.4" />
    <circle cx="1120" cy="520" r="3" fill-opacity="0.5" />
    <circle cx="1400" cy="350" r="4" fill-opacity="0.7" />
    <circle cx="1620" cy="230" r="2.5" fill-opacity="0.3" />
    <circle cx="850" cy="720" r="3.5" fill-opacity="0.4" />
  </g>
</svg>
