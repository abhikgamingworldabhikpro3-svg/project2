<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Radiant Squircle Gradient -->
    <linearGradient id="tf-main-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="48%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glossy Cap Face Gradient -->
    <linearGradient id="tf-cap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Cap Underbody -->
    <linearGradient id="tf-under-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <!-- Golden Flow Spark -->
    <linearGradient id="tf-gold-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="tf-glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern iOS/macOS Smooth Squircle -->
  <rect width="128" height="128" rx="34" fill="url(#tf-main-grad)" />

  <!-- Inner Soft Highlight Border -->
  <rect x="2.5" y="2.5" width="123" height="123" rx="31.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.5" />

  <!-- Icon Artwork Core -->
  <g filter="url(#tf-glow-shadow)">
    <!-- 1. Mortarboard Diamond (Top) -->
    <polygon points="64,28 104,48 64,68 24,48" fill="url(#tf-cap-grad)" />

    <!-- 2. Cap Arch Base -->
    <path d="M 40,58 L 64,70 L 88,58 L 88,68 C 88,80 77,87 64,87 C 51,87 40,80 40,68 Z" fill="url(#tf-under-grad)" />

    <!-- 3. Dynamic Curved Tassel & Gold Bead -->
    <path d="M 96,51 C 101,62 103,72 100,82" fill="none" stroke="url(#tf-gold-spark)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="100" cy="84" r="5" fill="url(#tf-gold-spark)" />

    <!-- 4. Luminous Wave Crest (Tuition Pulse) -->
    <path d="M 32,98 C 48,88 56,104 72,94 C 84,86 92,92 100,88" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
