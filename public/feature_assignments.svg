    <!-- Submission Card 3: Graded -->
    <g transform="translate(24, 256)">
      <rect width="462" height="74" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="28" cy="37" r="15" fill="#CFFAFE" />
      <text x="28" y="41" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0E7490" text-anchor="middle">RK</text>
      
      <text x="56" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Rohan Kapoor</text>
      <text x="56" y="46" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="500" fill="#64748B">Excellent mathematical derivations included</text>

      <rect x="370" y="20" width="76" height="34" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1" />
      <text x="408" y="41" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" fill="#047857" text-anchor="middle">92/100</text>
