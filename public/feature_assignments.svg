    </g>

    <line x1="24" y1="68" x2="486" y2="68" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Submission Card 1: Outstanding Grade -->
    <g transform="translate(24, 84)">
      <rect width="462" height="74" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="28" cy="37" r="15" fill="#EEF2FF" />
      <text x="28" y="41" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#4338CA" text-anchor="middle">JD</text>
      
      <text x="56" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Jessica Diaz</text>
      <text x="56" y="46" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="500" fill="#64748B">Submitted on time · 3 attachments reviewed</text>

      <rect x="370" y="20" width="76" height="34" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1" />
      <text x="408" y="41" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" fill="#047857" text-anchor="middle">98/100</text>
    </g>

    <!-- Submission Card 2: Feedback Pending -->
    <g transform="translate(24, 170)">
      <rect width="462" height="74" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="28" cy="37" r="15" fill="#FEF3C7" />
      <text x="28" y="41" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">BL</text>
      
      <text x="56" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Brandon Lee</text>
      <text x="56" y="46" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="500" fill="#64748B">Submitted 2 hours ago · Awaiting teacher review</text>

