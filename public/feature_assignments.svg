<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="asg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <filter id="asg-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="600" height="450" rx="24" fill="url(#asg-bg)" />

  <g filter="url(#asg-shadow)" transform="translate(45, 40)">
    <rect width="510" height="370" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Header -->
    <g transform="translate(24, 20)">
      <rect width="32" height="32" rx="8" fill="#E0F2FE" />
      <path d="M 10 7 L 18 7 L 22 11 L 22 25 L 10 25 Z" fill="none" stroke="#0284C7" stroke-width="2" />
      <line x1="14" y1="15" x2="18" y2="15" stroke="#0284C7" stroke-width="1.5" />
      <line x1="14" y1="19" x2="18" y2="19" stroke="#0284C7" stroke-width="1.5" />

      <text x="44" y="16" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Assignment Review & Grading</text>
      <text x="44" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="500" fill="#64748B">Thermodynamics Worksheet #04 · Due Tomorrow</text>

      <rect x="360" y="4" width="100" height="28" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
