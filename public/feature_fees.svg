<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fee-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>
    <filter id="fee-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#064E3B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" rx="24" fill="url(#fee-bg)" />

  <!-- Main Floating Receipt Card -->
  <g filter="url(#fee-shadow)" transform="translate(60, 30)">
    <!-- Card Frame -->
    <rect width="480" height="390" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Receipt Header Strip -->
    <rect width="480" height="8" rx="4" fill="#10B981" />

    <!-- Receipt Header -->
    <g transform="translate(32, 28)">
      <text x="0" y="20" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" fill="#0F172A">TUTORFLOW ACADEMY</text>
      <text x="0" y="38" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" fill="#64748B">RECEIPT #REC-2026-0842 · OFFICIAL COPY</text>

      <!-- Paid Stamp (Green Pill/Stamp) -->
      <g transform="translate(320, 2)">
        <rect width="96" height="32" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5" />
        <text x="48" y="21" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#15803D" text-anchor="middle" letter-spacing="1">PAID IN FULL</text>
      </g>
    </g>

    <!-- Hairline Divider -->
    <line x1="32" y1="84" x2="448" y2="84" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Details Grid -->
    <g transform="translate(32, 104)">
      <g transform="translate(0, 0)">
        <text x="0" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" text-transform="uppercase">STUDENT NAME</text>
        <text x="0" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Alexander Wright</text>
      </g>

      <g transform="translate(220, 0)">
        <text x="0" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" text-transform="uppercase">CLASS / BATCH</text>
        <text x="0" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#1E293B">AP Physics & Mechanics</text>
      </g>

      <g transform="translate(0, 56)">
        <text x="0" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" text-transform="uppercase">PAYMENT METHOD</text>
        <text x="0" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#1E293B">UPI / Bank Transfer</text>
      </g>

      <g transform="translate(220, 56)">
        <text x="0" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" text-transform="uppercase">TRANSACTION ID</text>
        <text x="0" y="32" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#475569">TXN_98432101</text>
      </g>
    </g>

    <!-- Hairline Divider -->
    <line x1="32" y1="216" x2="448" y2="216" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Table of Fees -->
    <g transform="translate(32, 236)">
      <rect width="416" height="42" rx="10" fill="#F8FAFC" />
      <text x="16" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#334155">Monthly Tuition Fee (Term 2)</text>
      <text x="400" y="26" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">$240.00</text>
    </g>

    <!-- Total Highlight Row -->
    <g transform="translate(32, 292)">
      <rect width="416" height="48" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
      <text x="16" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#065F46">TOTAL AMOUNT PAID</text>
      <text x="400" y="30" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800" fill="#047857" text-anchor="end">$240.00</text>
    </g>

    <!-- Footer Note & QR simulation -->
    <g transform="translate(32, 356)">
      <text x="0" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Digitally signed & generated by TutorFlow multi-tenant coaching engine.</text>
    </g>
  </g>
</svg>
