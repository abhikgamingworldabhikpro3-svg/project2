      <text x="38" y="42" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#4338CA" text-anchor="middle">DOC</text>
      
      <text x="72" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Organic Chemistry Reaction Mechanisms Cheat Sheet</text>
