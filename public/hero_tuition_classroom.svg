    <rect x="14" y="14" width="60" height="60" rx="10" fill="#1E1B4B" />
    <rect x="22" y="22" width="44" height="44" rx="6" fill="#FFFFFF" />
    <rect x="30" y="30" width="28" height="28" fill="#4F46E5" />
    <text x="86" y="38" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">Scan & Join</text>
    <text x="86" y="54" fill="#64748B" font-family="sans-serif" font-size="10">Direct Class QR</text>
    <rect x="14" y="88" width="152" height="36" rx="8" fill="#EEF2FF" />
    <text x="36" y="111" fill="#4338CA" font-family="monospace" font-size="14" font-weight="700">CODE: 8K9B2X</text>
  </g>

