    <text x="76" y="255" fill="#94A3B8" font-family="sans-serif" font-size="11">Assignments</text>
    <text x="76" y="290" fill="#94A3B8" font-family="sans-serif" font-size="11">Study Materials</text>
    <text x="76" y="325" fill="#94A3B8" font-family="sans-serif" font-size="11">Fee Collection</text>
    <text x="76" y="360" fill="#94A3B8" font-family="sans-serif" font-size="11">Reports (CSV)</text>

    <!-- Center Content Zone -->
    <!-- Stat Card 1 -->
    <rect x="224" y="72" width="200" height="96" rx="14" fill="#1E293B" stroke="#334155" />
    <text x="242" y="98" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Active Students</text>
    <text x="242" y="138" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="800">142</text>
    <text x="296" y="136" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700">100% Isolated</text>

    <!-- Stat Card 2 -->
    <rect x="440" y="72" width="200" height="96" rx="14" fill="#1E293B" stroke="#334155" />
    <text x="458" y="98" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Today Attendance</text>
    <text x="458" y="138" fill="#38BDF8" font-family="sans-serif" font-size="28" font-weight="800">96.4%</text>
