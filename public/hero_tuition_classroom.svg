    </text>

    <!-- Main Console Inside Monitor -->
    <!-- Left Navigation Column in Mock UI -->
    <rect x="28" y="72" width="180" height="438" rx="14" fill="#131C38" />
    <rect x="42" y="90" width="152" height="32" rx="8" fill="#4F46E5" />
    <text x="76" y="110" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Dashboard</text>
    <circle cx="58" cy="106" r="5" fill="#FFFFFF" />

    <text x="76" y="150" fill="#94A3B8" font-family="sans-serif" font-size="11">Classes (8)</text>
