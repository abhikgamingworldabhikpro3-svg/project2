  <g filter="url(#card-shadow)" transform="translate(1010, 320)">
    <rect width="200" height="160" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="36" cy="36" r="14" fill="#D1FAE5" />
    <path d="M 30 36 L 34 40 L 42 32" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="60" y="34" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">Fee Collected</text>
    <text x="60" y="48" fill="#64748B" font-family="sans-serif" font-size="10">Receipt #TF-10023</text>
    <line x1="20" y1="64" x2="180" y2="64" stroke="#F1F5F9" stroke-width="1.5" />
    <text x="24" y="86" fill="#64748B" font-family="sans-serif" font-size="10">Student</text>
    <text x="176" y="86" text-anchor="end" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="700">Maya Chen</text>
    <text x="24" y="106" fill="#64748B" font-family="sans-serif" font-size="10">Paid via UPI</text>
    <text x="176" y="106" text-anchor="end" fill="#059669" font-family="sans-serif" font-size="11" font-weight="800">$150.00</text>
    <rect x="20" y="120" width="160" height="26" rx="6" fill="#F8FAFC" />
    <text x="100" y="137" text-anchor="middle" fill="#6366F1" font-family="sans-serif" font-size="10" font-weight="700">Printable / PDF Ready</text>
