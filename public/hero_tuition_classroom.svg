    <text x="674" y="98" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Fees Collected</text>
    <text x="674" y="138" fill="#34D399" font-family="sans-serif" font-size="28" font-weight="800">$18,450</text>

