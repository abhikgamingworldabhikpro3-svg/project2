    <text x="686" y="252" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Calculus & Vectors</text>
    <text x="686" y="268" fill="#94A3B8" font-family="sans-serif" font-size="10">Batch A • Join: 8K9B2X</text>

    <rect x="672" y="294" width="200" height="52" rx="10" fill="#1E293B" />
    <text x="686" y="316" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">AP Physics Mechanics</text>
    <text x="686" y="332" fill="#94A3B8" font-family="sans-serif" font-size="10">Batch B • Join: 4P7L9V</text>

    <rect x="672" y="358" width="200" height="52" rx="10" fill="#1E293B" />
    <text x="686" y="380" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Organic Chemistry</text>
    <text x="686" y="396" fill="#94A3B8" font-family="sans-serif" font-size="10">Batch C • Join: 2M5W1T</text>

